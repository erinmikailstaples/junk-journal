name: Theme checks and Ghost upload

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and package theme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run check
      - run: npm run zip
      - run: npm run check:zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghost-theme-${{ github.sha }}
          path: dist/erin-junk-journal.zip
          if-no-files-found: error
          retention-days: 14
      - name: Save browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  upload:
    name: Upload to Ghost for manual activation
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ghost-production
    steps:
      - name: Check Ghost integration credentials
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: |
          if [ -z "$GHOST_ADMIN_API_URL" ] || [ -z "$GHOST_ADMIN_API_KEY" ]; then
            echo "::error::Set GHOST_ADMIN_API_URL and GHOST_ADMIN_API_KEY in the ghost-production environment or repository Actions secrets."
            exit 1
          fi
          if [[ "$GHOST_ADMIN_API_URL" != https://* ]]; then
            echo "::error::GHOST_ADMIN_API_URL must be the HTTPS API URL from your Ghost custom integration."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ghost-theme-${{ github.sha }}
          path: dist/
      - name: Give this upload its own theme identity
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: mv dist/erin-junk-journal.zip "dist/erin-junk-journal-${DEPLOY_COMMIT}.zip"
      - name: Upload the validated archive without activating it
        uses: TryGhost/action-deploy-theme@b1ff2a5eeac1d5438a0aab35eb996fe4010d889e # v2
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          version: v5.0
          file: dist/erin-junk-journal-${{ github.sha }}.zip
